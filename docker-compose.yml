services:
  postgres:
    # PG18 for the native uuidv7() function used as the default PK generator
    # in new tables (see postgres/init/04_sample_schema.sql).
    # NOTE: a data volume created by an older major (e.g. 16) will NOT start
    # under 18 — Postgres refuses to run against an incompatible data dir.
    # Upgrading an existing install needs a dump/restore (or pg_upgrade);
    # a fresh install just initialises cleanly.
    image: postgres:18-alpine
    restart: unless-stopped
    # Headroom over the combined pools (dashboard 30 + PostgREST 30 + ad-hoc
    # admin connections). 150 fits within the 2 GB recommended RAM — each
    # backend costs ~10 MB. Bump to ~300 once PgBouncer is in front.
    command:
      - "postgres"
      - "-c"
      - "max_connections=150"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      # Postgres 18+ defaults PGDATA to a version-specific path
      # (/var/lib/postgresql/<major>/docker) and moved the image's VOLUME to
      # /var/lib/postgresql. We pin the classic location so the data dir always
      # sits exactly at the volume mount below, unchanged across majors — which
      # keeps the mount and the dump/restore upgrade tooling
      # (scripts/pg-major-upgrade.sh) simple and version-independent.
      PGDATA: /var/lib/postgresql/data
      # Forwarded so init scripts can interpolate them.
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:?AUTHENTICATOR_PASSWORD must be set}
      DASHBOARD_ADMIN_PASSWORD: ${DASHBOARD_ADMIN_PASSWORD:?DASHBOARD_ADMIN_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Bound to loopback only — for local psql access. Remove in prod.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # Connection pooler in transaction mode. Lets PostgREST and the dashboard
  # multiplex many client connections onto a smaller, configurable number of
  # actual Postgres backends — important once traffic grows past a couple
  # hundred concurrent users. Realtime SSE bypasses this (it needs session
  # state for LISTEN), connecting directly to postgres:5432.
  pgbouncer:
    build:
      context: ./pgbouncer
    restart: unless-stopped
    environment:
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:?AUTHENTICATOR_PASSWORD must be set}
      DASHBOARD_ADMIN_PASSWORD: ${DASHBOARD_ADMIN_PASSWORD:?DASHBOARD_ADMIN_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "30"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # PgBouncer accepts plain TCP — a successful connect is enough.
      test: ["CMD-SHELL", "nc -z localhost 6432 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend

  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    environment:
      # PostgREST connects DIRECTLY to Postgres (not via PgBouncer) — same as
      # realtime. A direct *session* connection is what lets the schema-cache
      # reload LISTEN channel (below) work; transaction-pooled connections drop
      # it. PostgREST self-pools (PGRST_DB_POOL) and reuses a bounded set of
      # backends regardless of how many app users hit the API, so fronting it
      # with the transaction pooler bought ~nothing while breaking LISTEN AND
      # prepared statements. PgBouncer is intentionally retained for the
      # dashboard / serverless / ad-hoc clients — do NOT route PostgREST back
      # through it (that reintroduces the "new tables 404 until restart" bug).
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@postgres:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      # Default cap on rows returned per REST request. Admins can override this
      # at runtime from the dashboard (Settings), which writes an in-database
      # config GUC on the authenticator role that overrides this env value on the
      # next PostgREST restart. Without this, a single request could return an
      # entire table.
      PGRST_DB_MAX_ROWS: "${PGRST_DB_MAX_ROWS:-1000}"
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?PGRST_JWT_SECRET must be set}
      PGRST_OPENAPI_SERVER_PROXY_URI: ${API_PUBLIC_URL:-http://api.localhost}
      PGRST_DB_POOL: "30"
      # Direct connection → prepared statements are safe (and faster). They were
      # only disabled because transaction pooling reused connections across
      # sessions.
      PGRST_DB_PREPARED_STATEMENTS: "true"
      # LISTEN on the `pgrst` channel works again on the direct session
      # connection, so PostgREST auto-reloads its schema cache on NOTIFY. The DDL
      # event triggers in postgres/init/16_postgrest_reload.sql (existing installs:
      # migration 0024) fire that NOTIFY after every schema change, so new
      # tables/columns appear under /rest/v1 with no manual restart.
      PGRST_DB_CHANNEL_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      MINIO_BROWSER_REDIRECT_URL: ${DASHBOARD_PUBLIC_URL:-http://dashboard.localhost}
    volumes:
      - minio-data:/data
    ports:
      # Bound to loopback only — for `npm run dev` outside Docker to reach MinIO.
      # In prod the dashboard container talks to `minio:9000` over the internal
      # network and this mapping is irrelevant.
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # General queries go through PgBouncer (transaction-pooled).
      DATABASE_URL: postgres://dashboard_admin:${DASHBOARD_ADMIN_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-postgres}
      # Realtime LISTEN/NOTIFY needs a session-pinned connection, so it skips
      # PgBouncer entirely and talks straight to Postgres.
      REALTIME_DATABASE_URL: postgres://dashboard_admin:${DASHBOARD_ADMIN_PASSWORD}@postgres:5432/${POSTGRES_DB:-postgres}
      # Realtime "authorized" mode re-checks RLS per subscriber. This MUST be a
      # NON-bypassrls role — we use `authenticator` (same as PostgREST), and the
      # check function does SET ROLE authenticated. NEVER point this at
      # dashboard_admin/service_role or RLS would be bypassed.
      REALTIME_RLS_DATABASE_URL: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@postgres:5432/${POSTGRES_DB:-postgres}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      # Shared with PostgREST so JWTs signed here verify there and vice versa.
      # Used by /auth/v1/* (signing user tokens), /realtime (auth), and the
      # edge-function gate at /functions/v1/* (when verify_jwt is on).
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?PGRST_JWT_SECRET must be set}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:-http://dashboard.localhost}
      # Drives the MinIO SDK's endPoint for signing /storage/v1 URLs AND the
      # OpenAPI server URL surfaced by PostgREST. Always the public api host.
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://api.localhost}
      # AES-256-GCM key for encrypted edge-function env vars (lib/function-env.ts).
      FUNCTION_ENV_KEY: ${FUNCTION_ENV_KEY:?FUNCTION_ENV_KEY must be set}
      # CORS allowlist for /auth/v1, /functions/v1, /realtime — see lib/cors.ts.
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-}
      # Optional override for the OAuth callback base URL. Defaults to
      # API_PUBLIC_URL (auth lives on the api host); only set this if the
      # callback host ever needs to differ.
      AUTH_REDIRECT_BASE_URL: ${AUTH_REDIRECT_BASE_URL:-}
      AUDIT_LOG_DIR: /audit
    volumes:
      # Host path for the file-based audit log. The admin chooses the
      # subdirectory under this mount in the dashboard.
      - ${AUDIT_HOST_PATH:-./audit-logs}:/audit
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    networks:
      - backend

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_HOST: ${API_HOST:-api.localhost}
      DASHBOARD_HOST: ${DASHBOARD_HOST:-dashboard.localhost}
      CADDY_TLS: ${CADDY_TLS:-internal}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - postgrest
      - dashboard
      - minio
    networks:
      - backend

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:

networks:
  backend:
    driver: bridge
