# OneCode-standard: versionsopdateringer én gang om måneden, samlet i én PR.
# Sikkerhedsopdateringer kommer stadig med det samme (de styres ikke af schedule).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
