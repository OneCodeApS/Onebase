# Lægges i hvert projekt-repo som .github/workflows/security.yml
# Al logik ligger i det centrale repo "security-workflows".

name: Security

on:
  push:
    branches: [main, master, '[Ss]taging*', 'STAGING*', '[Pp]rod*', 'PROD*']   # merges til staging og produktion
  schedule:
    - cron: "0 5 * * 1"   # mandag kl. 05 UTC; den centrale workflow kører kun i lige uger = hver 14. dag
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  security:
    uses: OneCodeApS/security-workflows/.github/workflows/security-baseline.yml@main
    with:
      fail_on_findings: false    # sæt til true når repoet er ryddet op
      run_claude_review: false
    secrets:
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
